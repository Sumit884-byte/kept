services:
  - type: pserv
    name: kept-model
    runtime: docker
    dockerfilePath: ./model/Dockerfile
    plan: 2c-8g
    healthCheckPath: /health
    disk:
      name: model
      mountPath: /models
      sizeGB: 5
    envVars:
      - key: PORT
        value: "10000"
      - key: THREADS
        value: "2"
  - type: web
    name: kept
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TIGER_DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SECRET_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: LLM_BASE_URL
        fromService:
          name: kept-model
          type: pserv
          property: hostport
      - key: LLM_MODEL
        value: gemma-3-4b-it
      - key: POLL_INTERVAL_MS
        value: "600000"
