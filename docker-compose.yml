services:
  tiger:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: current
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d current"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - kept_tiger:/var/lib/postgresql/data

volumes:
  kept_tiger:
